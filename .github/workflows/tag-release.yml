name: Tag Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  VSCODE_QUALITY: 'oss'

jobs:
  compile:
    name: Compile & Hygiene
    runs-on: windows-2022
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Prepare node_modules cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline false

          # Clean up any existing node_modules and package-lock.json
          if (Test-Path "node_modules") {
            Remove-Item -Path "node_modules" -Recurse -Force
          }
          if (Test-Path "package-lock.json") {
            Remove-Item -Path "package-lock.json" -Force
          }

          # Use a single npm install command with proper flags
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps

          # Install build directory dependencies
          cd build
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ..

          # Install extension dependencies
          cd extensions/simple-browser
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ../..
          cd extensions/mermaid-chat-features
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ../..
          cd extensions/markdown-math
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ../..
          cd extensions/markdown-language-features
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ../..
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Compile & Hygiene
        run: npm exec -- npm-run-all2 -lp core-ci hygiene eslint valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOCHA_TIMEOUT: 10000

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  windows-electron-tests:
    name: Windows Electron Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Run Windows Electron Tests
        run: npm run test-electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-browser-tests:
    name: Windows Browser Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Run Windows Browser Tests
        run: npm run test-browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-remote-tests:
    name: Windows Remote Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Run Windows Remote Tests
        run: npm run test-remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows x86_64 Build
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Prepare node_modules cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline false

          # Clean up any existing node_modules and package-lock.json
          if (Test-Path "node_modules") {
            Remove-Item -Path "node_modules" -Recurse -Force
          }
          if (Test-Path "package-lock.json") {
            Remove-Item -Path "package-lock.json" -Force
          }

          # Use a single npm install command with proper flags
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps

          # Install build directory dependencies
          cd build
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          cd ..
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Windows x86_64
        run: npm run gulp vscode-win32-x64-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-win32-x64
          path: ./.build/win32-x64

  release:
    name: Create Release
    runs-on: windows-2022
    needs: [windows-build]
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vscode-win32-x64
          path: ./.build/win32-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            VS Code release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./.build/win32-x64/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
