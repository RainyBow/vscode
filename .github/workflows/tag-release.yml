name: Tag Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  VSCODE_QUALITY: 'oss'

jobs:
  compile:
    name: Compile & Hygiene
    runs-on: windows-2022
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # Explicitly set npm version to avoid version mismatch issues
          # Based on the project's requirement of npm < 11.2.0
          npm-version: '10.8.1'

      - name: Prepare node_modules cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline false
          npm config set cache-min 0

          for ($i=1; $i -le 5; $i++) { # try 5 times
            # Try npm install first to generate package-lock.json if it doesn't exist
            npm install --prefer-offline --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -eq 0) {
              # Then run npm ci for a clean install
              npm ci --prefer-offline --no-audit --no-fund
              if ($LASTEXITCODE -eq 0) { break }
            }
            if ($i -eq 5) {
              Write-Host "Npm install failed too many times" -ForegroundColor Red
              exit 1
            }
            Write-Host "Npm install failed $i, trying again..."
            Start-Sleep -Seconds 10
          }
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Compile & Hygiene
        run: npm exec -- npm-run-all2 -lp core-ci hygiene eslint valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  windows-electron-tests:
    name: Windows Electron Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          npm-version: '10.8.1'

      - name: Run Windows Electron Tests
        run: npm run test-electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-browser-tests:
    name: Windows Browser Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          npm-version: '10.8.1'

      - name: Run Windows Browser Tests
        run: npm run test-browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-remote-tests:
    name: Windows Remote Tests
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          npm-version: '10.8.1'

      - name: Run Windows Remote Tests
        run: npm run test-remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows x86_64 Build
    runs-on: windows-2022
    needs: compile
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          # Explicitly set npm version to avoid version mismatch issues
          # Based on the project's requirement of npm < 11.2.0
          npm-version: '10.8.1'

      - name: Prepare node_modules cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline false
          npm config set cache-min 0

          for ($i=1; $i -le 5; $i++) { # try 5 times
            # Try npm install first to generate package-lock.json if it doesn't exist
            npm install --prefer-offline --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -eq 0) {
              # Then run npm ci for a clean install
              npm ci --prefer-offline --no-audit --no-fund
              if ($LASTEXITCODE -eq 0) { break }
            }
            if ($i -eq 5) {
              Write-Host "Npm install failed too many times" -ForegroundColor Red
              exit 1
            }
            Write-Host "Npm install failed $i, trying again..."
            Start-Sleep -Seconds 10
          }
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Windows x86_64
        run: npm run vscode-win32-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-win32-x64
          path: ./.build/win32-x64

  release:
    name: Create Release
    runs-on: windows-2022
    needs: [windows-build]
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vscode-win32-x64
          path: ./.build/win32-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            VS Code release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./.build/win32-x64/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
